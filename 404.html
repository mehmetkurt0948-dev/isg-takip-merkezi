<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1f33">
  <meta name="robots" content="noindex">
  <title>Sayfa bulunamadı • İSG Takip</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=febba591">
  <style>
    .yok-sayfa { min-height: 100vh; display: grid; place-content: center; gap: 14px; padding: 32px 20px; text-align: center; }
    .yok-sayfa img { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto; }
    .yok-sayfa h1 { margin: 0; font-size: 24px; color: var(--ink); }
    .yok-sayfa p { margin: 0; max-width: 46ch; color: var(--ink-soft); line-height: 1.6; }
    .yok-sayfa .dugme { justify-self: center; margin-top: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <main class="yok-sayfa">
    <img src="assets/img/ikon-192.png" alt="" width="64" height="64">
    <h1>Sayfa bulunamadı</h1>
    <p>
      Aradığınız ekran bu adreste yok. İSG Takip Merkezi tek sayfalık bir
      uygulamadır; tüm ekranlara genel bakış üzerinden ulaşılır.
    </p>
    <a class="dugme birincil" href="./index.html">Genel bakışa dön</a>
  </main>
</body>
</html>
